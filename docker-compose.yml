services:
  mariadb:
    image: mariadb:11.4
    container_name: csf-mariadb
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change_root_password}
      MARIADB_DATABASE: ${DB_NAME:-pacific_csfnuxt}
      MARIADB_USER: ${DB_USER:-pacific_csfnuxt}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change_db_password}
      TZ: Asia/Bangkok
    ports:
      - "${DB_PORT:-3360}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csf-nuxt-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://uat.csf.co.th}
      DB_HOST: ${DOCKER_DB_HOST:-mariadb}
      DB_PORT: 3306
      DB_USER: ${DB_USER:-pacific_csfnuxt}
      DB_PASSWORD: ${DB_PASSWORD:-change_db_password}
      DB_NAME: ${DB_NAME:-pacific_csfnuxt}
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ./public/uploads:/app/public/uploads
    ports:
      - "3000:3000"

volumes:
  mariadb_data:
