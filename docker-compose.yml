services:
  mariadb:
    image: mariadb:11.4
    container_name: csf-mariadb
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: root_password_2026
      MARIADB_DATABASE: csf_db
      MARIADB_USER: csf_user
      MARIADB_PASSWORD: csf_password_2026
      TZ: Asia/Bangkok
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: csf-phpmyadmin
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    ports:
      - "8080:80"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csf-nuxt-web
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://uat.csf.co.th}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: csf_user
      DB_PASSWORD: csf_password_2026
      DB_NAME: csf_db
      ADMIN_JWT_SECRET: csf-enterprise-secret-change-in-production-2026
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - ./public/uploads:/app/public/uploads
    ports:
      - "3000:3000"

volumes:
  mariadb_data:
